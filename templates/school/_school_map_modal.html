{% if school_info and school_info.latitude and school_info.longitude %}
<div class="modal fade" id="schoolMapModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content border-0 rounded-4">
    <div class="modal-header"><h5 class="modal-title fs-6">موقع المدرسة</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button></div>
    <div class="modal-body p-2"><div id="school-map" style="width:100%;height:400px;border-radius:12px" data-lat="{{ school_info.latitude }}" data-lng="{{ school_info.longitude }}" data-name="{{ school_info.name_ar }}"></div></div>
  </div></div>
</div>
{% endif %}
