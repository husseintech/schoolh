{% extends 'school/base.html' %}
{% block title %}تأكيد العملية{% endblock %}
{% block page_heading %}تأكيد العملية{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 620px;">
    <div class="card-body text-center py-5">
        <i class="bi bi-shield-exclamation fs-1 text-warning"></i>
        <h4 class="mt-3">تأكيد تنفيذ العملية</h4>
        <p class="text-muted">هذه العملية ستغيّر بيانات أو حالة سجل. اضغط تأكيد للمتابعة أو ارجع للصفحة السابقة.</p>
        <form method="post" action="{{ request.get_full_path }}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle"></i> تأكيد</button>
        </form>
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">إلغاء</button>
    </div>
</div>
{% endblock %}
