{% extends 'school/base.html' %}
{% block title %}ملاحظات الزيارة التبادلية{% endblock %}
{% block page_heading %}ملاحظات الزيارة التبادلية{% endblock %}
{% block content %}

<div class="card mb-4">
    <div class="card-header"><i class="bi bi-calendar-event-fill"></i> بيانات الحصة التي حضرتها — قابلة للتعديل</div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label text-muted">المعلم المزار</label>
                <p class="fw-bold">{{ visit.host.full_name }}</p>
            </div>
            <div class="col-md-3">
                <label for="visit_date" class="form-label fw-bold">تاريخ الحضور</label>
                <input type="date" id="visit_date" name="visit_date" form="feedback-form" class="form-control" value="{{ visit.visit_date|date:'Y-m-d' }}" required>
            </div>
            <div class="col-md-3">
                <label for="student_class" class="form-label fw-bold">الصف</label>
                <select id="student_class" name="student_class" form="feedback-form" class="form-select" required>
                    <option value="">اختر الصف</option>
                    {% for class_item in classes %}
                    <option value="{{ class_item.id }}" {% if visit.student_class_id == class_item.id %}selected{% endif %}>{{ class_item.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label for="period" class="form-label fw-bold">رقم الحصة</label>
                <input type="number" id="period" name="period" form="feedback-form" class="form-control" min="1" step="1" value="{{ visit.period }}" required>
            </div>
            <div class="col-md-6">
                <label for="subject_topic" class="form-label fw-bold">المادة أو موضوع الحصة</label>
                <input type="text" id="subject_topic" name="subject_topic" form="feedback-form" class="form-control" maxlength="200" value="{{ visit.subject_topic }}" placeholder="اكتب اسم المادة أو موضوع الدرس" required>
            </div>
        </div>
    </div>
</div>



<div class="card">
    <div class="card-header"><i class="bi bi-journal-text"></i> ملاحظات الزيارة</div>
    <div class="card-body">
        <form method="post" id="feedback-form">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">أبرز النقاط الإيجابية</label>
                <textarea name="positive_points" class="form-control" rows="4" placeholder="اكتب أبرز النقاط الإيجابية التي لاحظتها في الحصة...">{{ visit.positive_points }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">أبرز النقاط التي تحتاج إلى تطوير</label>
                <textarea name="development_points" class="form-control" rows="4" placeholder="اكتب أبرز النقاط التي تحتاج إلى تطوير من وجهة نظرك...">{{ visit.development_points }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">ما تم الاتفاق عليه مع المعلم المزار</label>
                <textarea name="agreement" class="form-control" rows="4" placeholder="اكتب ما اتفقت عليه مع المعلم المزار...">{{ visit.agreement }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> حفظ الملاحظات</button>
            <a href="{% url 'teacher_visits' %}" class="btn btn-outline-secondary">إلغاء</a>
        </form>
    </div>
</div>
{% endblock %}
