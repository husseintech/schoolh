<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174995">
  <title>الاتصال غير متاح</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Tahoma,Arial,sans-serif;color:#172943;background:linear-gradient(145deg,#eef5ff,#fff)}main{width:min(430px,100%);padding:34px 25px;border:1px solid #dce8f7;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(30,70,125,.14)}.icon{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 18px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#174995,#2990c0);font-size:36px}h1{margin:0 0 10px;font-size:1.35rem}p{margin:0;color:#69778c;line-height:1.8;font-size:.9rem}button{margin-top:20px;padding:11px 22px;border:0;border-radius:12px;color:#fff;background:#205fbd;font-weight:700;font-size:.9rem;cursor:pointer}small{display:block;margin-top:14px;color:#98a2b1}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⌁</div>
    <h1>تعذر الاتصال بالموقع مؤقتًا</h1>
    <p>تحقق من اتصال الإنترنت، ثم حاول مرة أخرى. حفاظًا على خصوصيتك لا نعرض صفحات حسابك من ذاكرة قديمة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    <small>مدرسة المنصور الأساسية</small>
  </main>
</body>
</html>
