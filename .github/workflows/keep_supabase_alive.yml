name: Keep Supabase Alive

on:
  schedule:
    # فحص يومي حقيقي للموقع؛ الصفحة الرئيسية تنفذ استعلامات على قاعدة البيانات.
    - cron: '17 3 * * *'
  workflow_dispatch: # لإتاحة التشغيل اليدوي للتجربة

permissions:
  contents: read

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: true

jobs:
  ping-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the production site and database
        env:
          KEEPALIVE_URL: https://schoolhh.vercel.app/
        run: |
          set -euo pipefail
          request_url="${KEEPALIVE_URL}?keepalive=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status_code=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 20 \
            --connect-timeout 20 \
            --max-time 90 \
            --header "Cache-Control: no-cache" \
            --output keepalive-response.html \
            --write-out "%{http_code}" \
            "$request_url")

          test "$status_code" = "200"
          grep --quiet "النظام المدرسي" keepalive-response.html
          echo "Database-backed homepage responded successfully (HTTP ${status_code})."
