name: Django regression tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [security-hardening-2026-08-31]

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        env:
          DJANGO_DEBUG: 'False'
        run: python manage.py check
      - name: Run regression tests
        env:
          DJANGO_DEBUG: 'False'
        run: python manage.py test school open_learning
